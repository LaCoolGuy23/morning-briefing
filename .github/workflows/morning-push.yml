name: Morning Briefing Push

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Kathmandu"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-morning-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install google-auth requests
      - name: Fetch news and weather, then send push notification
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python scripts/send_briefing.py
